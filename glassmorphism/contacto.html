<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism - Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            CJH GLASS <span style="color: var(--text-muted); font-weight: 400; font-size: 0.75rem;" class="mono">[v3.0]</span>
        </div>
        <div class="nav-right">
            <div class="nav-links" id="navLinks">
            <a href="index.html">Inicio</a>
            <a href="blog.html">Blog</a>
            <a href="productos.html">Productos</a>
            <a href="contacto.html" class="active">Contacto</a>
            <a href="dashboard.html">Dashboard &rarr;</a>
            </div>
            <div class="theme-switch" id="themeSwitcher" data-theme-mode="system">
                <div class="theme-switch-indicator"></div>
                <button class="theme-switch-btn" data-theme-target="light" onclick="setThemeMode('light')" title="Modo Claro">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
                <button class="theme-switch-btn" data-theme-target="system" onclick="setThemeMode('system')" title="Modo Sistema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
                </button>
                <button class="theme-switch-btn" data-theme-target="dark" onclick="setThemeMode('dark')" title="Modo Oscuro">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                </button>
            </div>
            <button class="nav-toggle" onclick="toggleNav()" aria-label="Abrir menu" aria-expanded="false" id="navToggleBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            </button>
        </div>
    </nav>
    <div class="nav-scrim" id="navScrim" onclick="closeNav()"></div>

    <main>
        <section style="padding: 6rem 0;" id="contacto">
            <div style="max-width: 560px; margin: 0 auto; padding: 0 2.5rem; margin-bottom: 2.5rem;">
                <span class="badge badge-primary" style="margin-bottom: 0.5rem;">Contacto</span>
                <h2 style="font-size: 2.25rem; font-weight: 700;">Hablemos de tu proyecto</h2>
            </div>

            <div class="card" style="max-width: 560px; margin: 0 auto; padding: 2.5rem;">
                <form novalidate>
                    <div class="field">
                        <label for="contacto-nombre">Nombre</label>
                        <input type="text" id="contacto-nombre" name="nombre" placeholder="Tu nombre" autocomplete="name">
                        <p class="field-error" id="contacto-nombre-error" role="alert" hidden></p>
                    </div>

                    <div class="field">
                        <label for="contacto-email">Correo electrónico</label>
                        <input type="email" id="contacto-email" name="email" placeholder="tu@correo.com" autocomplete="email">
                        <p class="field-error" id="contacto-email-error" role="alert" hidden></p>
                    </div>

                    <div class="field">
                        <label for="contacto-mensaje">Mensaje</label>
                        <input type="text" id="contacto-mensaje" name="mensaje" placeholder="¿En qué podemos ayudarte?">
                        <p class="field-error" id="contacto-mensaje-error" role="alert" hidden></p>
                    </div>

                    <button type="submit" class="btn">Enviar mensaje</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="section-alt" style="text-align: center; padding: 4rem 2rem; color: var(--text-secondary); font-size: 0.85rem;">
        © 2026 Carlos Alberto Jiménez Hirashi. Glassmorphism Design Architecture.
    </footer>

    <script src="../js/theme-manager.js"></script>
    <script src="../js/nav-toggle.js"></script>
</body>
</html>
